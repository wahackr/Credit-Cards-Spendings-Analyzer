name: Test

on:
  # development only: the other remote branches (master, agent, streamlit-vpn-container)
  # are stale, and pushes there would each start a full suite. PRs are covered below.
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python suite, deploy tooling, image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The deployment skip-logic is load-bearing on the self-hosted pipeline.
      - name: Test deployment tooling
        run: node --test deploy/tools/*.test.cjs

      # Pinned to the image's interpreter rather than .python-version (3.13) so CI tests the
      # version that actually ships; reconciling the two is a separate change.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q -ra

      - name: Lint
        run: uv run flake8 src tests

      # Guards the deploy image on a GitHub-hosted runner: the deploy pipeline's
      # build step is the only other place this Dockerfile is exercised.
      - name: Build the deployment image
        run: docker build -f deploy/docker/analyzer.Dockerfile -t credit-card-analyzer:test .
