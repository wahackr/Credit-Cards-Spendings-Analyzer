[project]
name = "credit-cards-spendings-analysiser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.2.0",
    "langchain-google-genai>=4.1.2",
    "langchain-openai>=1.1.0",
    "markitdown[pdf]>=0.1.9",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "pytest>=9.2.0",
]

# src/ holds the importable packages, so tests need it on the path explicitly.
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
