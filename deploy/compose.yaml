# One stateless FastAPI container: no volumes, no database, nothing on disk between
# restarts (uploads and job state live in memory).
#
# deploy/tools/deploy.sh runs this with --env-file /dev/null, so the values below come
# only from exported environment (the GitHub environment vars/secrets on the runner).
# For manual runs, copy deploy/.env.example and use `--env-file deploy/.env`.
name: ${COMPOSE_PROJECT_NAME:-credit-card-analyzer-dev}

services:
  analyzer:
    build:
      context: ..
      dockerfile: deploy/docker/analyzer.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-credit-card-analyzer-dev}-analyzer:latest
    ports:
      # Loopback by default: the app has no authentication, so a routable bind lets any
      # device on the network upload 25 MB PDFs and spend the configured LLM quota.
      # Host port 8010 rather than 8000 because Portainer already publishes 8000 on this box.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-8010}:8000"
    environment:
      # Every optional variable carries an empty default: unset names otherwise make Compose
      # print a "not set, defaulting to blank string" warning on each command.
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-required}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_THINKING=${OPENAI_THINKING:-}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-}
      - MAX_CONCURRENT_STATEMENTS=${MAX_CONCURRENT_STATEMENTS:-2}
      # Dumps every statement's text and the LLM reply to the container log, so it stays
      # off: `docker compose logs` would then contain raw card data.
      - LLM_DEBUG=${LLM_DEBUG:-false}
    # Upper bound on a container that buffers up to MAX_CONCURRENT_STATEMENTS x 25 MB
    # uploads plus the PDF text extraction in RAM.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
